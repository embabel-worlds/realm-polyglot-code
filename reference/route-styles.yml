# HOW EACH FRAMEWORK DECLARES A ROUTE, as data. The Routes view joins these to any project's
# declarations (their annotations, decorators or attributes, as written) and calls (a router's method
# with a path as its first argument), so one query lists the endpoints of a project in any language
# — and adding a framework is adding rows here.
#
#   shape: annotation  pattern = a lower-case piece of the annotation as written ("@getmapping", "[httpget",
#                      "#[get(", ".get(" for a Python decorator); the path is its first quoted string.
#          call        pattern = the called name, exact (Gin's GET, Express's get); receivers = what it may
#                      be called on ([] any, [""] none); the path is the first argument, quoted or a symbol.
#   method: the HTTP method, ANY when the declaration does not say, CLIENT for a call to someone else's API.
#   role:   route (an endpoint this code serves), prefix (a path its routes sit under), resource (a whole
#           REST resource: Rails `resources :articles`, DRF's router.register), client (a call it makes).
#
# Patterns are matched against what the source says, by name: a project with its own `get(...)` decorator
# would be read as a route. Seeded on load, idempotent on styleId.

