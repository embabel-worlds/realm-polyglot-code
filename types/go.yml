- name: GoCall
  parents: [CallSite]
  visibility: internal
  userAnchor: false
  description: "A call in a Go file: the called name, what it is called on, its arguments and the function it is in. Matched by NAME only (`resolution: name`): say 'calls something named X', never that it calls a particular X. Reach it from (:CodeProject {key})-[:CALLS]->; name the parent (CallSite) to read every language at once."
  virtualJoins:
