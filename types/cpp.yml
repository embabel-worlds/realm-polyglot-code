# C++, read with the `source-tree` kind. Generated by tools/generate.py — edit that, not this.

- name: CppSource
  parents: [Source]
  visibility: internal
  userAnchor: false
  description: "A C++ source file of a project, with its line count, hash and syntax errors. Reach it from (:CodeProject {key})-[:HAS_SOURCE]->; name the parent (Source) to read every language at once."
  virtualJoins:
    - { anchorLabel: CodeProject, relationship: HAS_SOURCE, keyField: key, recordKeyField: anchorKey, producer: cppFiles, maxFanoutTotal: 200000,
        description: "(:CodeProject {key:$project})-[:HAS_SOURCE]->(x:CppSource)" }
  properties:
    path: "File path, relative to the project."
    language: "The language, as the producer names it."
    line: { type: int, description: "Line it is on." }
    url: "The line on the repository's host, when it has a file view."
    project: "The project as read: the folder, or host/repo@commit."
    parsed: { type: boolean, description: "The file was read and parsed (false: too large, too slow, or unreadable)." }
    errors: { type: int, description: "Syntax errors its tree holds; the rest of the file still answers." }

