- name: TypeScriptCall
  parents: [CallSite]
  visibility: internal
  userAnchor: false
  description: "A call in a TypeScript (and TSX) file: the called name, what it is called on, its arguments and the function it is in. Matched by NAME only (`resolution: name`): say "calls something named X", never that it calls a particular X. Reach it from (:CodeProject {key})-[:CALLS]->; name the parent (CallSite) to read every language at once."
  virtualJoins:
    - { anchorLabel: CodeProject, relationship: CALLS, keyField: key, recordKeyField: anchorKey, producer: typescriptCalls, maxFanoutTotal: 200000,
        description: "(:CodeProject {key:$project})-[:CALLS]->(x:TypeScriptCall)" }
  properties:
    path: "File path, relative to the project."
    language: "The language, as the producer names it."
    line: { type: int, description: "Line it is on." }
    url: "The line on the repository's host, when it has a file view."
    project: "The project as read: the folder, or host/repo@commit."
