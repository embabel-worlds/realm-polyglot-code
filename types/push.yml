# KOTLIN'S PUSH CHECKS. The `source-tree` kind runs queries/kotlin-push.scm over a project's Kotlin
# files; views/agent.yml PushChecks reads the rows for one file.
#
#   MATCH (p:CodeProject {key: $project})-[:HAS_PUSH_CHECK]->(c:KotlinPushCheck {path: $path})

- name: KotlinPushCheck
  visibility: internal
  userAnchor: false
  description: "One thing in a project's Kotlin a push may be refused for, as the realm's query captures it: `concat` (a + with a string literal operand) and `concat.literal` (that literal), `qualified` (a fully qualified name written inline). Each names the declaration it is in. Reach it from (:CodeProject {key})-[:HAS_PUSH_CHECK]->."
  virtualJoins:
    - { anchorLabel: CodeProject, relationship: HAS_PUSH_CHECK, keyField: key, recordKeyField: anchorKey, producer: kotlinPushChecks, maxFanoutTotal: 500000,
        description: "(:CodeProject {key:$project})-[:HAS_PUSH_CHECK]->(c:KotlinPushCheck)" }
  properties:
    id: { identity: true, description: "The file's id, `#capture:`, the capture name and its extent: unique per captured node." }
    capture: "What it is: concat, concat.literal, qualified."
    nodeType: "The grammar's name for the node."
    text: "Its text, whitespace collapsed, at most 200 characters."
    line: { type: int, description: "Line it starts on." }
    column: { type: int, description: "Column it starts at." }
    toLine: { type: int, description: "Line it ends on." }
    match: "The match it is part of: a + and its literal share one."
    enclosingId: "The id of the declaration it is in."
    enclosing: "The name of the declaration it is in."
    enclosingKind: "That declaration's kind: function, method, constructor, variable, constant, field, class, object, interface, enum or type; empty at a file's top level."
    path: "Source file, relative to the project."
    language: { values: [kotlin], description: "Always kotlin: the realm reads its push-check query over Kotlin files only." }
    url: "The line on the repository's host, when it has a file view."
    project: "The project as read: the folder, or host/repo@commit."
