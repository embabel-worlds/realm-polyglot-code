# A PROJECT IN ANY LANGUAGE, read where it lives when a query reaches it. Nothing is stored.
#
#   MATCH (p:CodeProject {key: $project})-[:HAS_SOURCE]->(s:Source)             its files, every language
#   (p)-[:DECLARES]->(d:SourceDeclaration)     types, functions, methods, fields, constants
#   (p)-[:IMPORTS]->(i:SourceImport)           every import
#   (p)-[:CALLS]->(c:CallSite)                 every call, matched by name
#
# Name a parent (Source, SourceDeclaration, SourceImport, CallSite) to read every language at once;
# name a child (PythonDeclaration, GoCall, JavaCodeDeclaration) to read one. Fourteen languages are read
# with tree-sitter (the `source-tree` kind), every one of them the same way: Java's classes, methods,
# imports and calls are rows under those parents like Kotlin's or Go's.
#
# Java is ALSO said a second time with its names resolved, for a question that needs them:
#   (p)-[:DECLARES_TYPE]->(t:JavaCodeType)       a type by binary name, with what it extends and implements
#   (p)-[:DECLARES_MEMBER]->(m:JavaCodeMember)   a member with its parameter and return types in full
# Those are not under the shared parents, so nothing is counted twice.
#
# A key is a repository (`https://github.com/acme/shop@v2`, the default branch without `@ref`) or a
# folder (under the world's data/, or in the owner's mounted workspace). Every row carries `project`
# — the folder, or host/repo@commit — and `url`, the line on GitHub or GitLab.

- name: CodeProject
  visibility: internal
  userAnchor: false
  description: "A code project in any language, named by its key: a repository URL, optionally @ref (`https://github.com/acme/shop@v2`), or a folder (under the world's data/, or in the owner's mounted workspace). Pin it — (:CodeProject {key: $project}) — and every hop reads it when the query reaches it. Nothing about it is stored."
  properties:
    key: { identity: true, description: "The project key, exactly as given." }
  examples:
    - q: "What is this repository written in?"
      cypher: |
        MATCH (p:CodeProject {key: 'https://github.com/acme/shop'})-[:HAS_SOURCE]->(s:Source)
        RETURN s.language AS language, count(s) AS files, sum(s.lines) AS lines
    - q: "Where is Order defined, in any language?"
      cypher: |
        MATCH (p:CodeProject {key: 'https://github.com/acme/shop'})-[:DECLARES]->(d:SourceDeclaration {name: 'Order'})
        RETURN d.language, d.kind, d.owner, d.path, d.fromLine
    - q: "Who calls something named save? (matched by name, not resolved)"
      cypher: |
        MATCH (p:CodeProject {key: 'https://github.com/acme/shop'})-[:CALLS]->(c:CallSite {method: 'save'})
        RETURN c.language, c.receiver, c.enclosing, c.path, c.line
    - q: "What does the Python code import from outside the project?"
      cypher: |
        MATCH (p:CodeProject {key: 'https://github.com/acme/shop'})-[:IMPORTS]->(i:PythonImport)
        WHERE NOT i.imported STARTS WITH '.'
        RETURN i.imported, count(DISTINCT i.path) AS files ORDER BY files DESC
    - q: "Which Java types does OrderService extend or implement, by binary name?"
      cypher: |
        MATCH (p:CodeProject {key: 'https://github.com/acme/shop'})-[:DECLARES_TYPE]->(t:JavaCodeType {simpleName: 'OrderService'})
        RETURN t.name, t.extends, t.implements, t.path, t.line

- name: JavaCodeType
  parents: [CodeType]
  visibility: internal
  userAnchor: false
  description: "A type a project declares in Java: class, interface, enum, record or annotation, by binary name, with resolved supertypes and annotations. Reach it from (:CodeProject {key})-[:DECLARES_TYPE]->. Its members are the JavaCodeMember rows whose `owner` is its `name`."
  virtualJoins:
    - { anchorLabel: CodeProject, relationship: DECLARES_TYPE, keyField: key, recordKeyField: anchorKey, producer: javaTypes, maxFanoutTotal: 200000,
        description: "(:CodeProject {key:$project})-[:DECLARES_TYPE]->(t:JavaCodeType)" }
  properties:
    id: { identity: true, description: "The project as read, `!`, the type's key in the file: unique per type and commit." }
    simpleName: "The name without package or enclosing type."
    extends: { cardinality: LIST, description: "Supertype, resolved." }
    implements: { cardinality: LIST, description: "Interfaces it implements, resolved." }
    annotations: { cardinality: LIST, description: "Annotations on the type, resolved names." }
    annotationText: { cardinality: LIST, description: "Each annotation as written." }
    modifiers: { cardinality: LIST, description: "public, abstract, final, …" }
    path: "Source file, relative to the project."
    line: { type: int, description: "Line it is declared on." }
    lastLine: { type: int, description: "The line its closing brace is on, so line..lastLine is the whole type, members included." }
    url: "The line on the repository's host, when it has one."
    project: "The project as read: the folder, or host/repo@commit."

- name: JavaCodeMember
  visibility: internal
  userAnchor: false
  description: "A field, constructor or method a project declares in Java, with resolved annotation names and each annotation as written (`annotationText`). Reach it from (:CodeProject {key})-[:DECLARES]->, beside every other language's declarations."
  virtualJoins:
    - { anchorLabel: CodeProject, relationship: DECLARES_MEMBER, keyField: key, recordKeyField: anchorKey, producer: javaMembers, maxFanoutTotal: 200000,
        description: "(:CodeProject {key:$project})-[:DECLARES_MEMBER]->(m:JavaCodeMember)" }
  properties:
    id: { identity: true, description: "The project as read, `!`, the member's key in the file: unique per member and commit." }
    modifiers: { cardinality: LIST, description: "public, static, final, …" }
    returnType: "A method's return type, resolved."
    parameters: { cardinality: LIST, description: "Each parameter, type and name." }
    type: "A field's declared Java type, resolved to its binary name where the file shows it (java.util.List); empty on a method or constructor."
    path: "Source file, relative to the project."
    language: { values: [java], description: "Always java: these rows come from the Java-only types and members emits." }
    line: { type: int, description: "Line it is declared on." }
    url: "The line on the repository's host, when it has one."
    project: "The project as read: the folder, or host/repo@commit."
