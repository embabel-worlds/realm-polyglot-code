# Java, read with the `source-tree` kind's Java emits: names resolved by binary name through the
# file's own imports and types, so its rows say more than syntax alone.
- { name: javaTypes,   kind: source-tree, emit: types,   languages: [java] }
- { name: javaMembers, kind: source-tree, emit: members, languages: [java] }
- { name: javaImports, kind: source-tree, emit: imports, languages: [java] }
