# Every language's declarations at once, for the code search source (sources.yml).
- { name: allDeclarations, kind: source-tree, emit: declarations }
# The appliance's document index, asked for more than its default, since a search is narrowed to one
# project after the read (by uri) and only to code inside it (by the `code` tag).
- { name: codeDocsVector, kind: vector, index: documents, k: 40, minScore: 0.0 }
- { name: codeDocsKeyword, kind: keyword, index: documents, k: 40, minScore: 0.0 }
