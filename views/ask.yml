# Asking a project a question, and answering from its code. The Atlas's and the Explorer's Ask use these,
# with SearchCode and Declarations (structure.yml):
#
#   IndexState        whether the project is indexed, and how much of it is held as searchable documents
#   MatchDeclarations the declarations whose NAME holds the question's words, read live from the source
#                     tree: no embeddings, so it answers before the index has run
#   SearchCode        the declarations closest in MEANING (the appliance's vector and keyword search, fused)
#   Declarations      the live rows and code of the declarations found
#   AskContext        what a declaration is: its code (a type's members), who calls it and what it calls
#   AnswerFromCode    the answer: the same code and neighbours, numbered, reduced by `synthesize` into an
#                     explanation that cites each declaration it relies on as [n]
#
# The app merges MatchDeclarations and SearchCode by `id`, so a declaration found both ways counts once,
# reads the best with Declarations, and hands their ids to AnswerFromCode in the order it numbers them.
#
# Every `id` is the declaration's key, computed exactly as the code-declarations source (sources.yml)
# names its document — code://<id> — so a cited declaration, a search hit and a document are one thing.
# Change the key there and change it here.
#
# READ ONLY WHAT IS ASKED ABOUT. Every declaration a query reaches is materialized, so reading all of a
# large project's (dice: 10,000) takes seconds per view. Each view's MATCH therefore filters on the
# declaration and its parameters alone — a name holding a term, a path an id names, a name in `calls`,
# code holding a name in `names` — which the appliance applies before anything is materialized. A
# filter that reads a value bound earlier in the query is applied after, so the app passes what the
# filter needs as parameters. A key counts the declarations of one name in one file (~2, ~3), so a
# filter must admit all of them or none: by name or by path, never by text alone.
#
# Calls and uses are matched by NAME in the code's text (`resolution: name`): a call to `save(` is a
# call to every declaration named save. The views say so, and so must an answer.

- name: IndexState
  description: >-
    How much of a project the code index holds: whether it is an IndexedProject, how many of its
    declarations are held as searchable documents (`indexed`), and when the last was indexed (epoch ms).
    Search by meaning sees only what is indexed; MatchDeclarations reads every declaration live. The
    code-declarations source's progress, when a run is under way, is in the realm's status.
  params:
    project: { type: string, description: "Project key." }
  cypher: |
    OPTIONAL MATCH (ip:IndexedProject {key: $project})
    WITH ip IS NOT NULL AS registered
    OPTIONAL MATCH (doc:Document)
    WHERE doc.uri STARTS WITH 'code://' + CASE WHEN $project STARTS WITH 'https://' THEN substring($project, 8) ELSE $project END + '!'
    RETURN registered, count(doc) AS indexed, max(doc.ingestionEpochMs) AS lastIndexedAt

- name: MatchDeclarations
  description: >-
    The declarations of an indexed project whose names hold a question's words, read live from the source
    tree — no embeddings, so it answers the moment a project is indexed, before any document exists.
    `terms` is the question's words, lower case, space separated, already stemmed ('security
    configuration', 'jwt validat'). A declaration is found by a term in its name; it then ranks by the
    terms its name holds (most), its owner's and its path's, and — where the name holds none of them
    that start a word — its code's (least); a name the words cover more of ranks higher. In a name a
    term must start a word (camelCase, snake_case or an acronym) to count most, so 'valid' ranks
    validateToken and JWTValidator above InvalidPasswordException. SecurityConfiguration matches 'security
    configuration'; test code ranks below the code it tests. Best first, with the same `id` SearchCode
    returns. Code that holds the words but is not named for them is SearchCode's to find.
  params:
    project: { type: string, description: "Project key, as it was indexed." }
    terms: { type: string, description: "Lower-case words, space separated (stems are fine: 'authenticat')." }
  cypher: |
    MATCH (ip:IndexedProject {key: $project})-[:DECLARES]->(d:CodeDeclaration)
    WHERE d.kind IN ['class', 'interface', 'struct', 'enum', 'trait', 'record', 'protocol', 'object', 'type', 'function', 'method', 'constructor']
      AND any(t IN split(toLower($terms), ' ') WHERE size(t) > 1 AND toLower(d.name) CONTAINS t)
    WITH d ORDER BY d.fromLine, d.id
    WITH d.path AS path, d.kind AS kind, coalesce(d.owner, '') AS owner, d.name AS name, collect(d) AS same
    UNWIND range(0, size(same) - 1) AS i
    WITH same[i] AS d, CASE WHEN $project STARTS WITH 'https://' THEN substring($project, 8) ELSE $project END + '!' + path + '#' + kind + ':'
             + CASE WHEN owner = '' THEN name ELSE owner + '.' + name END + CASE WHEN i = 0 THEN '' ELSE '~' + toString(i + 1) END AS key,
         [t IN split(toLower($terms), ' ') WHERE size(t) > 1] AS ts
    WITH d, key, ts, size([t IN ts WHERE toLower(d.name) STARTS WITH t OR d.name CONTAINS toUpper(substring(t, 0, 1)) + substring(t, 1)
                                OR d.name CONTAINS toUpper(t) OR toLower(d.name) CONTAINS '_' + t]) AS inName,
         size([t IN ts WHERE toLower(coalesce(d.owner, '')) CONTAINS t]) AS inOwner,
         size([t IN ts WHERE toLower(d.path) CONTAINS t]) AS inPath,
         size([t IN ts WHERE toLower(coalesce(d.text, '')) CONTAINS t]) AS inText
    WHERE size(ts) > 0 AND inName + inOwner + inText > 0
    WITH d, key, inName, inOwner, inPath, inText,
         (3.0 * inName + CASE WHEN inName = size(ts) THEN 0.0 ELSE 1.0 * inOwner END + 0.5 * inPath + CASE WHEN inName = 0 THEN 0.75 * inText ELSE 0.0 END) / size(ts)
         + CASE WHEN inName = size(ts) THEN 1.0 ELSE 0.0 END
         + 0.5 * reduce(n = 0, t IN ts | n + CASE WHEN toLower(d.name) CONTAINS t THEN size(t) ELSE 0 END) / size(d.name)
         + CASE WHEN d.kind IN ['class', 'interface', 'struct', 'enum', 'trait', 'record', 'protocol', 'object', 'type'] THEN 0.5
                WHEN d.kind = 'constructor' THEN -0.5 ELSE 0.0 END
         - CASE WHEN toLower(d.path) CONTAINS 'test' THEN 1.5 ELSE 0.0 END AS score
    RETURN d.language AS language, d.kind AS kind, CASE WHEN d.owner = '' THEN d.name ELSE d.owner + '.' + d.name END AS name,
           d.signature AS signature, d.javadoc AS doc, d.path AS file, d.fromLine AS line, d.url AS url, score,
           inName AS termsInName, inText AS termsInCode, key AS id
    ORDER BY score DESC, line LIMIT 25

- name: AskContext
  description: >-
    Declarations of an indexed project by id ('|' between ids), each with what an explanation needs:
    its signature, annotations and doc; its code (a function's lines, numbered; a type's members, up to
    about 4,000 characters); the functions and methods elsewhere that call it or use the type
    (`callers`, at most 8 listed of `callerCount`), and the declarations of the same language its code
    calls or uses (`callees`). Calls are matched by NAME in the code's text, so a common name is
    over-counted. Test code is left out of callers and callees unless the declaration is itself a test.
    Pass `names` and `calls` and it reads only the files the ids are in, the code that mentions their
    names and the declarations their code names: a second or later declaration of one name in a file
    that a caller shares with one that does not mention the name may then carry the first's id.
  params:
    project: { type: string, description: "Project key, as it was indexed." }
    ids: { type: string, description: "Declaration ids (as SearchCode, MatchDeclarations or a citation give them), '|' between them." }
    names: { type: string, default: "", description: "The ids' own names ('|' between them: jwtDecoder|SecurityConfiguration), to read only the code that mentions them for callers. Empty reads every declaration: right, but slow on a large project." }
    calls: { type: string, default: "", description: "The identifiers their code holds ('|' between them; Declarations gives the code), to read only declarations of those names for callees. Empty reads every declaration." }
    tests: { type: string, default: "yes", description: "'no' when none of the ids is test code: callers and callees are then read from outside test code only, as they are counted. 'yes' reads test code too." }
  cypher: |
    MATCH (ip:IndexedProject {key: $project})-[:DECLARES]->(d:CodeDeclaration)
    WHERE any(i IN split($ids, '|') WHERE i CONTAINS ('!' + d.path + '#'))
      AND ($names = '' OR d.name IN split($names, '|') OR d.owner IN split($names, '|'))
    WITH collect(d) AS inFiles
    OPTIONAL MATCH (ip:IndexedProject {key: $project})-[:DECLARES]->(c:CodeDeclaration)
    WHERE c.kind IN ['function', 'method', 'constructor'] AND c.text IS NOT NULL AND ($tests = 'yes' OR NOT toLower(c.path) CONTAINS 'test')
      AND any(n IN CASE WHEN $names = '' THEN [''] ELSE split($names, '|') END
              WHERE c.text CONTAINS (' ' + n + ' ') OR c.text CONTAINS (' ' + n + '(') OR c.text CONTAINS (' ' + n + '<') OR c.text CONTAINS (' ' + n + '.')
                 OR c.text CONTAINS (' ' + n + ')') OR c.text CONTAINS ('(' + n + ' ') OR c.text CONTAINS ('(' + n + '.') OR c.text CONTAINS ('<' + n + '>')
                 OR c.text CONTAINS ('<' + n + ',') OR c.text CONTAINS (' ' + n + '::') OR c.text CONTAINS (': ' + n + ',') OR c.text CONTAINS (' ' + n + '\n')
                 OR c.text CONTAINS ('.' + n + '(') OR c.text CONTAINS ('(' + n + '(') OR c.text CONTAINS ('!' + n + '(') OR c.text CONTAINS ('\t' + n + '(')
                 OR c.text CONTAINS ('::' + n) OR c.text CONTAINS ('.' + n + ' {') OR c.text CONTAINS ('.' + n + '{'))
    WITH inFiles, collect(c) AS naming
    OPTIONAL MATCH (ip:IndexedProject {key: $project})-[:DECLARES]->(e:CodeDeclaration)
    WHERE $calls = '' OR (e.name IN split($calls, '|')
      AND e.kind IN ['function', 'method', 'constructor', 'class', 'interface', 'struct', 'enum', 'trait', 'record', 'protocol', 'object', 'type']
      AND ($tests = 'yes' OR NOT toLower(e.path) CONTAINS 'test'))
    WITH inFiles, naming, collect(e) AS called
    UNWIND inFiles + naming + called AS d
    WITH DISTINCT d
    WITH d ORDER BY d.fromLine, d.id
    WITH d.path AS path, d.kind AS kind, coalesce(d.owner, '') AS owner, d.name AS name, collect(d) AS same
    UNWIND range(0, size(same) - 1) AS i
    WITH same[i] AS d, CASE WHEN $project STARTS WITH 'https://' THEN substring($project, 8) ELSE $project END + '!' + path + '#' + kind + ':'
             + CASE WHEN owner = '' THEN name ELSE owner + '.' + name END + CASE WHEN i = 0 THEN '' ELSE '~' + toString(i + 1) END AS key
    WITH collect({d: d, key: key, code: d.kind IN ['function', 'method', 'constructor'], test: toLower(d.path) CONTAINS 'test',
                  type: d.kind IN ['class', 'interface', 'struct', 'enum', 'trait', 'record', 'protocol', 'object', 'type']}) AS all
    UNWIND [x IN all WHERE x.key IN split($ids, '|')] AS picked
    WITH all, picked.d AS d, picked.key AS id, picked.type AS isType, picked.test AS isTest
    WITH all, d, id, isType, isTest,
         CASE WHEN isType
              THEN [' ' + d.name + ' ', ' ' + d.name + '(', ' ' + d.name + '<', ' ' + d.name + '.', ' ' + d.name + ')', '(' + d.name + ' ', '(' + d.name + '.', '<' + d.name + '>', '<' + d.name + ',', ' ' + d.name + '::', ': ' + d.name + ',', ' ' + d.name + '\n']
              ELSE ['.' + d.name + '(', ' ' + d.name + '(', '(' + d.name + '(', '!' + d.name + '(', '\t' + d.name + '(', '::' + d.name, '.' + d.name + ' {', '.' + d.name + '{'] END AS uses
    WITH all, d, id, isType, isTest,
         [x IN all WHERE x.code AND x.d.text CONTAINS d.name AND x.key <> id AND (isTest OR NOT x.test)
            AND NOT (x.d.path = d.path AND x.d.fromLine <= d.fromLine AND x.d.toLine >= d.toLine)
            AND NOT (x.d.path = d.path AND x.d.fromLine >= d.fromLine AND x.d.toLine <= d.toLine)
            AND any(u IN uses WHERE x.d.text CONTAINS u)] AS callers,
         [x IN all WHERE isType AND x.d.owner = d.name AND x.d.path = d.path] AS members
    WITH all, d, id, isType, isTest, callers, members,
         CASE WHEN isType THEN reduce(acc = '', m IN members | CASE WHEN size(acc) > 4000 THEN acc ELSE acc + coalesce(m.d.text, toString(m.d.fromLine) + ': ' + coalesce(m.d.signature, m.d.name)) + '\n' END)
              ELSE coalesce(d.text, '') END AS body
    WITH d, id, callers, members, body,
         [x IN all WHERE size(x.d.name) > 3 AND body CONTAINS x.d.name AND x.key <> id AND x.d.language = d.language AND (x.code OR x.type) AND (isTest OR NOT x.test)
            AND NOT (x.d.path = d.path AND x.d.fromLine >= d.fromLine AND x.d.toLine <= d.toLine)
            AND NOT (x.d.path = d.path AND x.d.fromLine <= d.fromLine AND x.d.toLine >= d.toLine)
            AND any(u IN CASE WHEN x.code THEN ['.' + x.d.name + '(', ' ' + x.d.name + '(', '(' + x.d.name + '(', '!' + x.d.name + '(', '::' + x.d.name]
                              ELSE [' ' + x.d.name + ' ', ' ' + x.d.name + '(', ' ' + x.d.name + '<', ' ' + x.d.name + '.', '(' + x.d.name + ' ', '(' + x.d.name + '.', '<' + x.d.name + '>', ' ' + x.d.name + '::', ': ' + x.d.name] END
                   WHERE body CONTAINS u)] AS callees
    RETURN id, d.language AS language, d.kind AS kind, CASE WHEN d.owner = '' THEN d.name ELSE d.owner + '.' + d.name END AS name, d.name AS simpleName,
           d.signature AS signature, d.javadoc AS doc, d.annotationText AS annotations, d.path AS file, d.fromLine AS line, d.toLine AS toLine, d.url AS url,
           CASE WHEN size(body) > 4000 THEN substring(body, 0, 4000) + '\n…' ELSE body END AS code, size(members) AS memberCount,
           size(callers) AS callerCount,
           [c IN callers[0..8] | {id: c.key, name: CASE WHEN c.d.owner = '' THEN c.d.name ELSE c.d.owner + '.' + c.d.name END, kind: c.d.kind, file: c.d.path, line: c.d.fromLine, url: c.d.url}] AS callers,
           size(callees) AS calleeCount,
           [c IN callees[0..12] | {id: c.key, name: CASE WHEN c.d.owner = '' THEN c.d.name ELSE c.d.owner + '.' + c.d.name END, kind: c.d.kind, file: c.d.path, line: c.d.fromLine, url: c.d.url}] AS callees,
           'name' AS resolution

- name: AnswerFromCode
  description: >-
    An answer to a question about an indexed project, written from its code: the declarations given
    (ids, '|' between them, best first) are numbered [1], [2], … in that order, each handed to the model
    with its signature, annotations, doc, code (more for the first three) and the names of what calls it
    and what it calls (matched by name), and `synthesize` traces through them to explain how the code
    does what is asked, citing each declaration it relies on by its number ([2], or [2:30-41] for lines).
    One model call: the eight items together stay under the 12,000 characters one `synthesize` call
    takes (about 2,300 each for [1] and [2], 1,500 for [3], 700 for the rest, code cut first: 11,200 at most), because
    past that it folds in batches — two calls and a third to join them, three times as long. It answers only from the code given: what the declarations do not show, it says is
    not shown. Find the ids with MatchDeclarations and SearchCode, and their code with Declarations;
    pass `names` and `calls` to read only what the answer needs (as AskContext does).
  params:
    project: { type: string, description: "Project key, as it was indexed." }
    question: { type: string, description: "The question, in words." }
    ids: { type: string, description: "Declaration ids, best first, '|' between them (at most about 10)." }
    names: { type: string, default: "", description: "The ids' own names ('|' between them: jwtDecoder|SecurityConfiguration), to read only the code that mentions them for callers. Empty reads every declaration: right, but slow on a large project." }
    calls: { type: string, default: "", description: "The identifiers their code holds ('|' between them; Declarations gives the code), to read only declarations of those names for callees. Empty reads every declaration." }
    tests: { type: string, default: "yes", description: "'no' when none of the ids is test code: callers and callees are then read from outside test code only, as they are counted. 'yes' reads test code too." }
  cypher: |
    MATCH (ip:IndexedProject {key: $project})-[:DECLARES]->(d:CodeDeclaration)
    WHERE any(i IN split($ids, '|') WHERE i CONTAINS ('!' + d.path + '#'))
      AND ($names = '' OR d.name IN split($names, '|') OR d.owner IN split($names, '|'))
    WITH collect(d) AS inFiles
    OPTIONAL MATCH (ip:IndexedProject {key: $project})-[:DECLARES]->(c:CodeDeclaration)
    WHERE c.kind IN ['function', 'method', 'constructor'] AND c.text IS NOT NULL AND ($tests = 'yes' OR NOT toLower(c.path) CONTAINS 'test')
      AND any(n IN CASE WHEN $names = '' THEN [''] ELSE split($names, '|') END
              WHERE c.text CONTAINS (' ' + n + ' ') OR c.text CONTAINS (' ' + n + '(') OR c.text CONTAINS (' ' + n + '<') OR c.text CONTAINS (' ' + n + '.')
                 OR c.text CONTAINS (' ' + n + ')') OR c.text CONTAINS ('(' + n + ' ') OR c.text CONTAINS ('(' + n + '.') OR c.text CONTAINS ('<' + n + '>')
                 OR c.text CONTAINS ('<' + n + ',') OR c.text CONTAINS (' ' + n + '::') OR c.text CONTAINS (': ' + n + ',') OR c.text CONTAINS (' ' + n + '\n')
                 OR c.text CONTAINS ('.' + n + '(') OR c.text CONTAINS ('(' + n + '(') OR c.text CONTAINS ('!' + n + '(') OR c.text CONTAINS ('\t' + n + '(')
                 OR c.text CONTAINS ('::' + n) OR c.text CONTAINS ('.' + n + ' {') OR c.text CONTAINS ('.' + n + '{'))
    WITH inFiles, collect(c) AS naming
    OPTIONAL MATCH (ip:IndexedProject {key: $project})-[:DECLARES]->(e:CodeDeclaration)
    WHERE $calls = '' OR (e.name IN split($calls, '|')
      AND e.kind IN ['function', 'method', 'constructor', 'class', 'interface', 'struct', 'enum', 'trait', 'record', 'protocol', 'object', 'type']
      AND ($tests = 'yes' OR NOT toLower(e.path) CONTAINS 'test'))
    WITH inFiles, naming, collect(e) AS called
    UNWIND inFiles + naming + called AS d
    WITH DISTINCT d
    WITH d ORDER BY d.fromLine, d.id
    WITH d.path AS path, d.kind AS kind, coalesce(d.owner, '') AS owner, d.name AS name, collect(d) AS same
    UNWIND range(0, size(same) - 1) AS i
    WITH same[i] AS d, CASE WHEN $project STARTS WITH 'https://' THEN substring($project, 8) ELSE $project END + '!' + path + '#' + kind + ':'
             + CASE WHEN owner = '' THEN name ELSE owner + '.' + name END + CASE WHEN i = 0 THEN '' ELSE '~' + toString(i + 1) END AS key
    WITH collect({d: d, key: key, code: d.kind IN ['function', 'method', 'constructor'], test: toLower(d.path) CONTAINS 'test',
                  type: d.kind IN ['class', 'interface', 'struct', 'enum', 'trait', 'record', 'protocol', 'object', 'type']}) AS all, split($ids, '|') AS wanted
    UNWIND [x IN all WHERE x.key IN wanted] AS picked
    WITH all, wanted, picked.d AS d, picked.key AS id, picked.type AS isType, picked.test AS isTest
    WITH all, d, id, isType, isTest, [k IN range(0, size(wanted) - 1) WHERE wanted[k] = id][0] + 1 AS num,
         CASE WHEN isType
              THEN [' ' + d.name + ' ', ' ' + d.name + '(', ' ' + d.name + '<', ' ' + d.name + '.', ' ' + d.name + ')', '(' + d.name + ' ', '(' + d.name + '.', '<' + d.name + '>', '<' + d.name + ',', ' ' + d.name + '::', ': ' + d.name + ',', ' ' + d.name + '\n']
              ELSE ['.' + d.name + '(', ' ' + d.name + '(', '(' + d.name + '(', '!' + d.name + '(', '\t' + d.name + '(', '::' + d.name, '.' + d.name + ' {', '.' + d.name + '{'] END AS uses
    WITH all, d, id, isType, isTest, num,
         [x IN all WHERE x.code AND x.d.text CONTAINS d.name AND x.key <> id AND (isTest OR NOT x.test)
            AND NOT (x.d.path = d.path AND x.d.fromLine <= d.fromLine AND x.d.toLine >= d.toLine)
            AND NOT (x.d.path = d.path AND x.d.fromLine >= d.fromLine AND x.d.toLine <= d.toLine)
            AND any(u IN uses WHERE x.d.text CONTAINS u)] AS callers,
         CASE WHEN num <= 3 THEN 6000 ELSE 2500 END AS budget
    WITH all, d, id, isType, isTest, num, callers, budget,
         CASE WHEN isType THEN reduce(acc = '', m IN [x IN all WHERE x.d.owner = d.name AND x.d.path = d.path] | CASE WHEN size(acc) > budget THEN acc ELSE acc + coalesce(m.d.text, toString(m.d.fromLine) + ': ' + coalesce(m.d.signature, m.d.name)) + '\n' END)
              ELSE coalesce(d.text, '') END AS body
    WITH d, num, callers, budget, body,
         [x IN all WHERE size(x.d.name) > 3 AND body CONTAINS x.d.name AND x.key <> id AND x.d.language = d.language AND (x.code OR x.type) AND (isTest OR NOT x.test)
            AND NOT (x.d.path = d.path AND x.d.fromLine >= d.fromLine AND x.d.toLine <= d.toLine)
            AND NOT (x.d.path = d.path AND x.d.fromLine <= d.fromLine AND x.d.toLine >= d.toLine)
            AND any(u IN CASE WHEN x.code THEN ['.' + x.d.name + '(', ' ' + x.d.name + '(', '(' + x.d.name + '(', '!' + x.d.name + '(', '::' + x.d.name]
                              ELSE [' ' + x.d.name + ' ', ' ' + x.d.name + '(', ' ' + x.d.name + '<', ' ' + x.d.name + '.', '(' + x.d.name + ' ', '(' + x.d.name + '.', '<' + x.d.name + '>', ' ' + x.d.name + '::', ': ' + x.d.name] END
                   WHERE body CONTAINS u)] AS callees
    WITH num, body,
         '[' + toString(num) + '] ' + d.language + ' ' + d.kind + ' ' + CASE WHEN d.owner = '' THEN d.name ELSE d.owner + '.' + d.name END
           + ', in ' + d.path + ' lines ' + toString(d.fromLine) + '-' + toString(d.toLine) + '\n'
           + reduce(a = '', t IN coalesce(d.annotationText, []) | a + t + '\n') + coalesce(d.signature, '') + '\n'
           + CASE WHEN coalesce(d.javadoc, '') = '' THEN '' WHEN size(d.javadoc) > 300 THEN substring(d.javadoc, 0, 300) + '…\n' ELSE d.javadoc + '\n' END AS head,
         '\nCalled or used by (matched by name): ' + CASE WHEN size(callers) = 0 THEN 'nothing in this project' ELSE reduce(a = '', c IN callers[0..6] | a + CASE WHEN c.d.owner = '' THEN c.d.name ELSE c.d.owner + '.' + c.d.name END + '; ') + CASE WHEN size(callers) > 6 THEN 'and ' + toString(size(callers) - 6) + ' more' ELSE '' END END
           + '\nCalls or uses (matched by name): ' + CASE WHEN size(callees) = 0 THEN 'nothing declared in this project' ELSE reduce(a = '', c IN callees[0..10] | a + CASE WHEN c.d.owner = '' THEN c.d.name ELSE c.d.owner + '.' + c.d.name END + '; ') END AS tail,
         CASE WHEN num <= 2 THEN 2300 WHEN num = 3 THEN 1500 ELSE 700 END AS cap
    WITH num, head, tail, cap, CASE WHEN cap - size(head) - size(tail) < 200 THEN 200 ELSE cap - size(head) - size(tail) END AS room, body
    WITH num, cap, head + CASE WHEN size(body) > room THEN substring(body, 0, room) + '\n…' ELSE body END + tail AS whole
    WITH num, CASE WHEN size(whole) > cap + 200 THEN substring(whole, 0, cap + 200) + '…' ELSE whole END AS item
    ORDER BY num
    RETURN synthesize(item, 'Answer this question about the code of ' + $project + ': ' + $question
           + ' Explain HOW it works by tracing through the code given, step by step: what each declaration does, what it calls and in what order, and where data comes from and goes. Cite every declaration you rely on by its item number in square brackets, like [2], or with its lines after a colon, like [2:30-41]; never put a bare line number in square brackets. Name classes and methods in backticks. Use only the code given; where it does not show something the question needs, say so plainly rather than guess. Be direct: lead with the answer, then the trace, in at most about 250 words.') AS answer,
           count(item) AS declarations
